name: Keep Space Warm

on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sf --max-time 20 "https://24f2000058-mcq-solver-app.hf.space/health" \
            && echo "Space is awake" \
            || echo "Ping failed (Space may be cold-starting or rebuilding)"
